<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{doc:description}}">
  <title>{{doc:title}} · MZSH</title>
  <link rel="canonical" href="/">
  <link rel="stylesheet" href="/_astro/photoswipe.Cc_ZZLyy.css">
  <link rel="stylesheet" href="/_astro/Base.2d1c2dc5.css">
  <link rel="stylesheet" href="/assets/site-ui/navigation.css">
  <link rel="stylesheet" href="/assets/reading-area.css">
  <link rel="stylesheet" href="/assets/site-ui/work-documents.css">
  <script defer src="/assets/analytics.js" data-mzsh-analytics data-website-id="9cca2387-fae9-4a77-8e5e-40dfd9897fce"></script>
</head>
<body class="work-doc-page">
  <div class="site-chrome">
    {{doc:skip}}
    {{doc:header}}
    <main id="main" tabindex="-1" class="site-chrome-main">
      <mzsh-reading class="work-doc-layout">
        <aside class="work-doc-sidebar" data-pagefind-ignore>
          <a class="work-doc-back" href="{{doc:backHref}}">{{doc:backLabel}}</a>
          <p class="work-doc-name">{{doc:workTitle}}</p>
          <div class="work-doc-tree">
            <p class="work-doc-tree-heading">{{doc:documents}}</p>
            <nav aria-label="{{doc:documents}}"><ul>{{doc:tree}}</ul></nav>
          </div>
        </aside>
        {{doc:outline}}
        <div class="work-doc-content">
          <p class="work-doc-breadcrumb" data-work-doc-engagement data-pagefind-ignore><a href="{{doc:backHref}}">{{doc:workTitle}}</a><span aria-hidden="true">/</span>{{doc:documents}}</p>
          <article>
            {{doc:heading}}
            <div class="prose sl-markdown-content" data-pagefind-body>{{body}}</div>
          </article>
          <div class="work-doc-adjacent" data-pagefind-ignore>{{doc:adjacent}}</div>
        </div>
      </mzsh-reading>
    </main>
    {{doc:footer}}
  </div>
  {{doc:menu}}
  <script type="module" src="/viewport.js"></script>
  <script type="module" src="/_astro/ReadingEnhancements.astro_astro_type_script_index_0_lang.jfxlepAz.js"></script>
  <script type="module" src="/_astro/ImageViewer.astro_astro_type_script_index_0_lang.CcVinRbp.js"></script>
</body>
</html>
